
<!-- ================= FRONTEND (ADVANCED UI) ================= -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeSphere Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Poppins;background:#020617;color:white;}
header{display:flex;justify-content:space-between;padding:20px 50px;background:#0f172a;}
.btn{padding:10px 18px;background:#22d3ee;border:none;border-radius:8px;cursor:pointer;}
.container{padding:30px;}
.card{background:#0f172a;padding:20px;margin:10px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.5);}
input{padding:10px;margin:5px;border-radius:5px;border:none;}
.hidden{display:none;}
.hero{text-align:center;padding:80px;}
.hero h1{font-size:40px;}
</style>
</head>

<body>

<header>
<h2>CodeSphere Pro</h2>
<div>
<button class="btn" onclick="showLogin()">Login</button>
<button class="btn" onclick="showSignup()">Signup</button>
</div>
</header>

<div class="hero">
<h1>Launch Your Tech Career 🚀</h1>
<p>Jobs | Resume | Hiring | Growth</p>
</div>

<div class="container">

<div id="login" class="hidden card">
<h3>Login</h3>
<input id="loginEmail" placeholder="Email"><br>
<input id="loginPassword" type="password" placeholder="Password"><br>
<button class="btn" onclick="login()">Login</button>
</div>

<div id="signup" class="hidden card">
<h3>Signup</h3>
<input id="name" placeholder="Name"><br>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button class="btn" onclick="signup()">Signup</button>
</div>

<div id="dashboard" class="hidden">
<h3>User Dashboard</h3>
<input type="file" id="resume">
<button class="btn" onclick="uploadResume()">Upload Resume</button>
<button class="btn" onclick="loadJobs()">Load Jobs</button>
<div id="jobs"></div>
</div>

<div id="admin" class="hidden card">
<h3>Admin Panel</h3>
<input id="title" placeholder="Job Title"><br>
<input id="company" placeholder="Company"><br>
<input id="salary" placeholder="Salary"><br>
<button class="btn" onclick="addJob()">Add Job</button>
</div>

</div>

<script>
let token="";

function hideAll(){["login","signup","dashboard","admin"].forEach(id=>document.getElementById(id).classList.add("hidden"));}
function showLogin(){hideAll();login.classList.remove("hidden");}
function showSignup(){hideAll();signup.classList.remove("hidden");}
function showDashboard(){hideAll();dashboard.classList.remove("hidden");}

async function signup(){
await fetch("http://127.0.0.1:5000/signup",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({name:name.value,email:email.value,password:password.value})});
alert("Signup done");showLogin();}

async function login(){
const res=await fetch("http://127.0.0.1:5000/login",{
method:"POST",headers:{"Content-Type":"application/json"},
body:JSON.stringify({email:loginEmail.value,password:loginPassword.value})});
const data=await res.json();
if(data.token){token=data.token;showDashboard();if(loginEmail.value=="admin@gmail.com")admin.classList.remove("hidden");}
}

async function loadJobs(){
const res=await fetch("http://127.0.0.1:5000/jobs");
const data=await res.json();
jobs.innerHTML="";
data.forEach(j=>{
jobs.innerHTML+=`<div class='card'>
<h3>${j.title}</h3><p>${j.company}</p><p>${j.salary}</p>
<button onclick="saveJob(${j.id})" class='btn'>❤️ Save</button>
</div>`});}

async function addJob(){
await fetch("http://127.0.0.1:5000/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:title.value,company:company.value,salary:salary.value})});alert("Added");}

async function saveJob(id){
await fetch("http://127.0.0.1:5000/save",{method:"POST",headers:{"Content-Type":"application/json","Authorization":token},body:JSON.stringify({job_id:id})});alert("Saved");}

async function uploadResume(){
let file=document.getElementById("resume").files[0];
let formData=new FormData();
formData.append("file",file);
await fetch("http://127.0.0.1:5000/upload",{method:"POST",body:formData});
alert("Uploaded");}

</script>
</body>
</html>
